# $schema: https://json.schemastore.org/github-action.json
name: build

on:
  push:
    branches:
      - "*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: nschloe/action-cached-lfs-checkout@v1

      - uses: docker/setup-buildx-action@v2
        id: buildx
        with:
          install: true


      - name: Build image for tests
        # Build host-platform image and persist VERSION for later push step.
        run: |
          VERSION="$(date '+%Y%m%d%H%M%S')_$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./build.sh "$VERSION"

      # reading and writing to mounted directories doesn't work unless permissions are given to 'other'
      - name: permissions for running tests with mounts
        run: |
          find ./tests -type d -exec chmod 777 {} +
          find ./tests -type f -exec chmod 644 {} +

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host test dependencies
        run: pip install -r requirements-host.txt

      - name: Integration tests from host
        run: ./run_tests.sh
        
      - name: Login to Docker Hub
        if: (github.ref == 'refs/heads/main' || contains(github.ref, 'refs/tag'))
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        if: (github.ref == 'refs/heads/main' || contains(github.ref, 'refs/tag'))
        run: ./build.sh "${{ env.VERSION }}" --push